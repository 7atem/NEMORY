name: iosApp
options:
  bundleIdPrefix: com.nemory
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    # Gradle needs to write the framework outside the Xcode sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
    SWIFT_VERSION: "6.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleVersion: "11"
        NSFaceIDUsageDescription: "Nemory uses Face ID to demo the shared authentication layer."
        NSCameraUsageDescription: "Nemory uses the camera to capture documents and photos into your vault."
        NSPhotoLibraryUsageDescription: "Nemory lets you pick photos from your library to store in your vault."
        NSLocationWhenInUseUsageDescription: "Nemory can attach your current location to captures so you remember where they happened."
        NSRemindersUsageDescription: "Nemory connects with Apple Reminders to sync deadlines, bill reminders, and expiry alerts."
        NSCalendarsUsageDescription: "Nemory connects with Apple Calendar to link document events, flights, and expiry dates."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemory.ios.sample
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - shared
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    dependencies:
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Build Shared Kotlin Framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -e
          cd "$SRCROOT/.."
          bash ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pnemory.skipNativeForTests=true
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nemory.ios.sample.uitests
    dependencies:
      - target: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppUITests
