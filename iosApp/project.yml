name: iosApp
options:
  bundleIdPrefix: com.nemory
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    # Gradle needs to write the framework outside the Xcode sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Simulator builds do not require code signing; the KMP task already signs the framework.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"
    SWIFT_VERSION: "6.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - shared
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    dependencies:
      - framework: shared.framework
        embed: true
    preBuildScripts:
      - name: Build Shared Kotlin Framework
        shell: /bin/sh
        script: |
          set -e
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        inputFiles:
          - $(SRCROOT)/../shared/build.gradle.kts
          - $(SRCROOT)/../shared/src/commonMain/kotlin/com/vaultbrain/shared/ui/sample/SharedSampleScreen.kt
        outputFiles:
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework/shared
