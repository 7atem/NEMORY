# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetpackCompose=true
kapt.incremental.apt=true
objectbox.debug=false
org.gradle.tooling.parallel=true

# Fix for AndroidLocationsException
android.newDsl=false

android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.builtInKotlin=false

# Qwen3-VL-2B-Instruct GGUF artifacts (Q4_K_M language model + Q8_0 mmproj vision
# projector), run through llama.cpp/mtmd. Both artifacts are pinned by SHA-256 so a
# changed or corrupted download is rejected before it can be loaded.
QWEN_MODEL_URL=https://huggingface.co/Qwen/Qwen3-VL-2B-Instruct-GGUF/resolve/main/Qwen3VL-2B-Instruct-Q4_K_M.gguf
QWEN_MODEL_SHA256=089d75c52f4b7ffc56ba998ffc50aae89fcafc755f9e7208aacca281dca6c2ae
QWEN_MODEL_SIZE_BYTES=1107409952
QWEN_MMPROJ_URL=https://huggingface.co/Qwen/Qwen3-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf
QWEN_MMPROJ_SHA256=f9a68fabba69c3b81e153367b2c7521030b0fa8bb0de400c9599c8e6725f9c82
QWEN_MMPROJ_SIZE_BYTES=445053216
# Pinned llama.cpp release built into the native bridge (CMake FetchContent).
LLAMACPP_TAG=v0.4.0

# Experimental Arabic VL transcription path (default off). When true, captures whose
# Latin-only OCR produced too little text are re-transcribed with the image-capable
# on-device tier. Unvalidated on-device; scaffolding only.
nemory.arabicVlExperiment=false
