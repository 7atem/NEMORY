# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetpackCompose=true
kapt.incremental.apt=true
objectbox.debug=false
org.gradle.tooling.parallel=true

# Fix for AndroidLocationsException
android.newDsl=false

android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.builtInKotlin=false

# Gemma 3 1B int4 MediaPipe task bundle. The artifact is pinned by SHA-256 so a
# changed or corrupted download is rejected before it can be loaded.
GEMMA_MODEL_URL=https://huggingface.co/nikhil2024/gemma3-1b-it-litert-mirror/resolve/main/gemma3-1b-it-int4.task
GEMMA_MODEL_SHA256=e3d981c01aeaaac69a84ffa0d4be13281b3176731063f1bea1c9fe6887bd9dee
GEMMA_MODEL_SIZE_BYTES=554661243
