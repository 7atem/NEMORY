name: iOS validation
on:
  push:
    branches: [main, ios-kmp-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '16.4'
  IOS_RUNTIME: '18.5'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK required by Gradle configuration
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Select and record Apple toolchain
        run: |
          set -euo pipefail
          mkdir -p iosApp/build shared/build/logs
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          uname -m | tee iosApp/build/architecture.txt
          xcodebuild -version | tee iosApp/build/xcode-version.txt
          xcrun simctl list runtimes | tee iosApp/build/runtimes.txt
          xcrun simctl list devices available -j > iosApp/build/devices.json
          DEVICE_ID=$(python3 - <<'PY'
          import json, os
          runtime_target = os.environ.get('IOS_RUNTIME', '18').replace('.', '-')
          data = json.load(open('iosApp/build/devices.json'))['devices']
          target_runtime = next((r for r in data.keys() if runtime_target in r), None)
          if not target_runtime and data:
              target_runtime = list(data.keys())[-1]
          devices = data.get(target_runtime, []) if target_runtime else []
          matches = [d['udid'] for d in devices if 'iPhone' in d['name'] and d.get('isAvailable', False)]
          if not matches:
              for r_devices in data.values():
                  matches = [d['udid'] for d in r_devices if 'iPhone' in d['name'] and d.get('isAvailable', False)]
                  if matches:
                      break
          if not matches:
              raise SystemExit('No compatible iPhone simulator available')
          print(matches[0])
          PY
          )
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b || true
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | tee iosApp/build/xcodegen-version.txt
          cd iosApp
          xcodegen generate
      - name: Run shared Kotlin Native tests
        run: |
          set -euo pipefail
          bash ./gradlew :shared:iosSimulatorArm64Test -Pnemory.skipNativeForTests=true --console=plain 2>&1 | tee shared/build/logs/ios-simulator-test.log
      - name: Build, launch and test bilingual iOS sample
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath iosApp/build/DerivedData \
            -resultBundlePath iosApp/build/iosApp.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee iosApp/build/xcodebuild.log
      - name: Build and package iOS IPA for USB Sideloading
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath iosApp/build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee iosApp/build/xcodebuild-release.log
          mkdir -p iosApp/build/Payload
          cp -R iosApp/build/DerivedDataRelease/Build/Products/Release-iphoneos/iosApp.app iosApp/build/Payload/
          cd iosApp/build
          zip -r Nemory-iOS.ipa Payload
      - name: Upload Nemory iOS IPA for USB Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Nemory-iOS-IPA
          retention-days: 7
          path: iosApp/build/Nemory-iOS.ipa
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d iosApp/build/iosApp.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/iosApp.xcresult --output-path iosApp/build/screenshots
          fi
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          retention-days: 7
          path: |
            iosApp/build/*.txt
            iosApp/build/*.json
            iosApp/build/*.log
            iosApp/build/iosApp.xcresult
            iosApp/build/screenshots/
            shared/build/logs/
            shared/build/reports/
            shared/build/test-results/
