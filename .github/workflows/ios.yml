name: iOS validation
on:
  push:
    branches: [main, ios-kmp-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '16.4'
  IOS_RUNTIME: '18.5'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK required by Gradle configuration
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Select and record Apple toolchain
        run: |
          set -euo pipefail
          mkdir -p iosApp/build shared/build/logs
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          uname -m | tee iosApp/build/architecture.txt
          xcodebuild -version | tee iosApp/build/xcode-version.txt
          xcrun simctl list runtimes | tee iosApp/build/runtimes.txt
          xcrun simctl list devices available -j > iosApp/build/devices.json
          DEVICE_ID=$(python3 - <<'PY'
          import json, os, re
          env_rt = os.environ.get('IOS_RUNTIME', '18')
          data = json.load(open('iosApp/build/devices.json'))['devices']
          valid_runtimes = []
          for rt_id, devs in data.items():
              if 'iOS' not in rt_id: continue
              iphones = [d for d in devs if 'iPhone' in d['name'] and d.get('isAvailable', False)]
              if iphones: valid_runtimes.append((rt_id, iphones))
          if not valid_runtimes: raise SystemExit('No compatible iOS simulator available')
          def parse_version(rt_id):
              m = re.search(r'iOS-(\d+)-(\d+)', rt_id)
              return (int(m.group(1)), int(m.group(2))) if m else (0,0)
          valid_runtimes.sort(key=lambda x: parse_version(x[0]), reverse=True)
          selected_iphones = None
          for rt_id, iphones in valid_runtimes:
              if env_rt.replace('.', '-') in rt_id:
                  selected_iphones = iphones
                  break
          if not selected_iphones: selected_iphones = valid_runtimes[0][1]
          selected_device = None
          for pref in ['iPhone 16 Pro', 'iPhone 15 Pro', 'iPhone 14 Pro']:
              for d in selected_iphones:
                  if pref in d['name']:
                      selected_device = d
                      break
              if selected_device: break
          if not selected_device: selected_device = selected_iphones[0]
          print(selected_device['udid'])
          PY
          )
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b || true
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version | tee iosApp/build/xcodegen-version.txt
          cd iosApp
          xcodegen generate
      - name: Run shared Kotlin Native tests
        run: |
          set -euo pipefail
          bash ./gradlew :shared:iosSimulatorArm64Test -Pnemory.skipNativeForTests=true --console=plain 2>&1 | tee shared/build/logs/ios-simulator-test.log
      - name: Build, launch and test bilingual iOS sample
        timeout-minutes: 4
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath iosApp/build/DerivedData \
            -resultBundlePath iosApp/build/iosApp.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee iosApp/build/xcodebuild.log
      - name: Copy UI screenshots to workspace
        if: always()
        run: |
          SCREENSHOT_DIR="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}/nemory-screenshots"
          if [ -d "$SCREENSHOT_DIR" ]; then
            mkdir -p iosApp/build/nemory-screenshots
            cp -R "$SCREENSHOT_DIR"/. iosApp/build/nemory-screenshots/
          fi
      - name: Upload iOS UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          retention-days: 30
          path: iosApp/build/nemory-screenshots/
      - name: Build and package iOS IPA for USB Sideloading
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath iosApp/build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee iosApp/build/xcodebuild-release.log
          mkdir -p iosApp/build/Payload
          cp -R iosApp/build/DerivedDataRelease/Build/Products/Release-iphoneos/iosApp.app iosApp/build/Payload/
          cd iosApp/build
          zip -r Nemory-iOS.ipa Payload
      - name: Upload Nemory iOS IPA for USB Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Nemory-iOS-IPA
          retention-days: 7
          path: iosApp/build/Nemory-iOS.ipa
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d iosApp/build/iosApp.xcresult ]; then
            xcrun xcresulttool export attachments --path iosApp/build/iosApp.xcresult --output-path iosApp/build/screenshots
          fi
      - name: Send logs to webhook
        if: always()
        run: |
          if [ -f iosApp/build/xcodebuild.log ]; then
            curl -s -X POST -H "Content-Type: text/plain" --data-binary @iosApp/build/xcodebuild.log https://webhook.site/50cecc7c-5967-464e-9b5d-71eadf87d7d7 || true
          fi
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.sha }}
          retention-days: 7
          path: |
            iosApp/build/*.txt
            iosApp/build/*.json
            iosApp/build/*.log
            iosApp/build/iosApp.xcresult
            iosApp/build/screenshots/
            shared/build/logs/
            shared/build/reports/
            shared/build/test-results/
